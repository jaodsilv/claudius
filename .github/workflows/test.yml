name: Tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "vitest.config.mjs"
      - "package.json"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "vitest.config.mjs"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

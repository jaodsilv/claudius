name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*/hooks/scripts/lib/**'

permissions:
  contents: write

jobs:
  release:
    # Skip release commits to prevent infinite loop
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, 'chore(sync):')"
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Detect and bump versions
        id: bump
        run: |
          chmod +x scripts/ci-bump-versions.sh
          RESULT=$(bash scripts/ci-bump-versions.sh ".")
          echo "$RESULT" | jq .
          BUMPED=$(echo "$RESULT" | jq -r '.bumped')
          echo "bumped=$BUMPED" >> $GITHUB_OUTPUT
          if [[ "$BUMPED" == "true" ]]; then
            echo "version=$(echo "$RESULT" | jq -r '.version')" >> $GITHUB_OUTPUT
            echo "$RESULT" | jq -r '.summary' > /tmp/release-summary.md
          fi

      - name: Sync lib files
        if: steps.bump.outputs.bumped == 'true'
        run: |
          changed=false
          while IFS= read -r plugin_lib; do
            if ! diff -r scripts/lib "$plugin_lib" > /dev/null 2>&1; then
              rm -rf "$plugin_lib"
              cp -r scripts/lib "$plugin_lib"
              changed=true
            fi
          done < <(find . -path "*/hooks/scripts/lib" -type d)

          if [[ "$changed" == "true" ]]; then
            git add '*/hooks/scripts/lib/*'
            git commit -m "chore(sync): sync lib files for release v${{ steps.bump.outputs.version }}"
          fi

      - name: Commit and tag
        id: commit
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git add .claude-plugin/marketplace.json package.json
          git add '*/.claude-plugin/plugin.json'
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --target "${{ steps.commit.outputs.commit_sha }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file /tmp/release-summary.md

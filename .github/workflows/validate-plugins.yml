name: Validate Plugins

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "analyzer/**"
      - "brainstorm.claude/**"
      - "cc/**"
      - "gitx/**"
      - "naming/**"
      - "planner.claude/**"
      - "review-loop/**"
      - "walkthrough/**"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "analyzer/**"
      - "brainstorm.claude/**"
      - "cc/**"
      - "gitx/**"
      - "naming/**"
      - "planner.claude/**"
      - "review-loop/**"
      - "walkthrough/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Validate plugins
        run: node scripts/validate-plugins.mjs

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Plugin validation failed. Check workflow logs for details.'
            })

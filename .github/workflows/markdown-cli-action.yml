name: markdown-cli-action

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-cli-action:
    runs-on: ubuntu-latest
    steps:
      - uses: DavidAnson/markdownlint-cli2-action@main
        continue-on-error: true
        with:
          config: "config/claude.markdownlint-cli2.yaml"
      - uses: DavidAnson/markdownlint-cli2-action@main
        continue-on-error: true
        with:
          config: "config/readme.markdownlint-cli2.yaml"
      - uses: DavidAnson/markdownlint-cli2-action@main
        continue-on-error: true
        with:
          config: "config/other.markdownlint-cli2.yaml"

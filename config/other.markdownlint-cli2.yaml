# Configuration

config:
  # MD013 - line-length
  MD013:
    line_length: 140
    code_blocks: false
    tables: false
    headings: false
  # MD004 - ul-style: use dash for all unordered lists
  MD004:
    style: dash
  # MD023 - heading-start-left: disabled
  MD023: false
  # MD032 - blanks-around-lists: disabled
  MD032: false
  # MD003 - heading-style
  MD003:
    style: atx
  # MD060 - table-column-style: disabled (tables have mixed styles)
  MD060: false

frontMatter: ^\[[^\]]\]\([^\)]*\)

# Globs

globs:
  - "**/*.md"
  - "*.md"

ignores:
  - "README.md"
  - "**/README.md"
  - "**/agents/**/*.md"
  - "**/agents/*.md"
  - "**/commands/**/*.md"
  - "**/commands/*.md"
  - "**/output-styles/**/*.md"
  - "**/output-styles/*.md"
  - "**/skills/**/*.md"
  - "**/skills/*.md"

# Fix any fixable errors

fix: true

# Ignore files referenced by .gitignore (only valid at root)

gitignore: true

# Show found files on stdout (only valid at root)
showFound: true
